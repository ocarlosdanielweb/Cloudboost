<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/main.min.css">
    <title>Components | CloudBoost</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="content-box">
                <img src="./imgs/icon01.svg" alt="" class="content-box-img">
                <p class="content-box-title">Alcance mais</p>
                <p class="content-box-description">Aumente o tráfego do seu site e suas vendas utilizando o e-mail marketing.</p>
            </div>

            <div class="avatars">
            <div class="profiles">
                <img src="./imgs/avatar01.webp" alt="">
                <img src="./imgs/avatar02.webp" alt="">
                <img src="./imgs/avatar03.webp" alt="">
                <img src="./imgs/avatar04.webp" alt="">
            </div>
            <div class="rating">
                <img src="/imgs/star.svg" alt="">
                <span><strong>(99K</strong> Reviews)</span>
            </div>
            </div>
            
        </div>
        
    </main>
</body>
</html>
